components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 10-minute access token. Session validity is checked server-side.
  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 1000
      additionalProperties: false
      required:
      - code
      - message
    ApiError:
      type: object
      properties:
        code:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 1000
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          maxLength: 100
      additionalProperties: false
      required:
      - code
      - message
      - requestId
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      additionalProperties: false
      required:
      - error
    PageMeta:
      type: object
      properties:
        requestId:
          type: string
          maxLength: 100
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      additionalProperties: false
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
          minLength: 1
      additionalProperties: false
      required:
      - csrfToken
    ExpectedVersion:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - expectedVersion
    Register:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        clientPlatform:
          type: string
          enum:
          - WEB
          - ANDROID
          - IOS
          - WINDOWS
          - MACOS
      additionalProperties: false
      required:
      - email
      - password
      - fullName
      - clientPlatform
    Login:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
        clientPlatform:
          type: string
          enum:
          - WEB
          - ANDROID
          - IOS
          - WINDOWS
          - MACOS
      additionalProperties: false
      required:
      - email
      - password
      - clientPlatform
    Refresh:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
        clientPlatform:
          type: string
          enum:
          - WEB
          - ANDROID
          - IOS
          - WINDOWS
          - MACOS
      additionalProperties: false
      required:
      - clientPlatform
      description: Web refresh uses HttpOnly cookie; native clients send refreshToken.
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          minimum: 600
          maximum: 600
        user:
          $ref: '#/components/schemas/User'
        sessionId: &id001
          type: string
          format: uuid
        refreshToken:
          type: string
          nullable: true
          description: Included only for native clients. Web receives and rotates refresh credential through its
            HttpOnly cookie.
      additionalProperties: false
      required:
      - accessToken
      - expiresIn
      - user
      - sessionId
    User:
      type: object
      properties:
        id: *id001
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 8
          maxLength: 20
          nullable: true
        avatar:
          allOf:
          - $ref: '#/components/schemas/Asset'
          nullable: true
          type: object
        roles:
          type: array
          items:
            type: string
            enum:
            - BUYER
            - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - LOCKED
        version:
          type: integer
          minimum: 0
        createdAt: &id002
          type: string
          format: date-time
        updatedAt: *id002
      additionalProperties: false
      required:
      - id
      - email
      - fullName
      - roles
      - status
      - version
      - createdAt
      - updatedAt
    ProfilePatch:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 8
          maxLength: 20
          nullable: true
        avatarAssetId:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
    AddressWrite:
      type: object
      properties: &id003
        recipientName: &id004
          type: string
          minLength: 1
          maxLength: 120
        phone: &id005
          type: string
          minLength: 8
          maxLength: 20
        line1: &id006
          type: string
          minLength: 1
          maxLength: 250
        ward: &id007
          type: string
          minLength: 1
          maxLength: 120
        district: &id008
          type: string
          minLength: 1
          maxLength: 120
        province: &id009
          type: string
          minLength: 1
          maxLength: 120
        country: &id010
          type: string
          enum:
          - VN
        isDefault: &id011
          type: boolean
      additionalProperties: false
      required:
      - recipientName
      - phone
      - line1
      - ward
      - district
      - province
      - country
      - isDefault
    AddressSnapshot:
      type: object
      properties:
        recipientName:
          type: string
        phone:
          type: string
        line1:
          type: string
        ward:
          type: string
        district:
          type: string
        province:
          type: string
        country:
          type: string
          enum:
          - VN
        postalCode:
          type: string
          maxLength: 20
          nullable: true
      additionalProperties: false
      required:
      - recipientName
      - phone
      - line1
      - ward
      - district
      - province
      - country
    AddressPatch:
      type: object
      properties: *id003
      additionalProperties: false
    Address:
      type: object
      properties:
        id: *id001
        recipientName: *id004
        phone: *id005
        line1: *id006
        ward: *id007
        district: *id008
        province: *id009

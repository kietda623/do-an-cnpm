name: Windows Desktop Demo Checks

on:
  pull_request:
    paths:
      - .github/workflows/desktop-demo.yml
      - apps/api/src/common/http/**
      - apps/api/src/modules/identity/**
      - apps/desktop/**
      - apps/storefront/**
      - packages/api-client/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches: ["**"]
    paths:
      - .github/workflows/desktop-demo.yml
      - apps/api/src/common/http/**
      - apps/api/src/modules/identity/**
      - apps/desktop/**
      - apps/storefront/**
      - packages/api-client/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-demo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: windows-desktop-demo
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Activate pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version

      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.94.1
          cache: false

      - name: Install frozen workspace
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Check desktop scripts and Rust shell
        shell: bash
        run: pnpm --filter @marketplace/desktop desktop:test

name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Workspace, PostgreSQL, and Redis checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:local_test_password@localhost:5432/marketplace_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:local_test_password@localhost:5432/marketplace_test?schema=public
      TEST_DATABASE_NAME_CONFIRMATION: marketplace_test
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
      RATE_LIMIT_KEY_PREFIX: marketplace-ci

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Lint workspaces
        run: pnpm lint:workspaces

      - name: Typecheck workspaces
        run: pnpm typecheck

      - name: Regenerate and verify OpenAPI types
        run: |
          pnpm --filter @marketplace/api-client generate:types
          git diff --exit-code -- packages/api-client/src/generated/index.ts

      - name: Run unit tests
        run: pnpm test

      - name: Run contract tests
        run: pnpm test:contracts

      - name: Build workspaces
        run: pnpm build

      - name: Run PostgreSQL integration tests
        run: pnpm --filter @marketplace/api test:integration

      - name: Run payment and cancellation concurrency tests
        run: pnpm test:concurrency

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run storefront checkout E2E
        run: pnpm test:e2e:checkout

      - name: Run fulfillment E2E
        run: pnpm test:e2e:fulfillment

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check database migration and Prisma schema parity
        run: pnpm --filter @marketplace/api prisma:schema:check
